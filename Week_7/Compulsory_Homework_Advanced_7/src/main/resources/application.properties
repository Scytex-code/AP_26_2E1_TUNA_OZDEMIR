spring.application.name=movie-spring-boot-app
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.freemarker.template-loader-path=classpath:/
spring.freemarker.suffix=.ftl
spring.freemarker.check-template-location=false

app.security.jwt.secret=${JWT_SECRET:Zm9yLWxhYi03LXNwcmluZy1ib290LW1vdmllLWFwcC1zZWNyZXQta2V5LTEyMzQ1Njc4OTA=}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.security.default-user.username=${API_USERNAME:apiuser}
app.security.default-user.password=${API_PASSWORD:password}

movie.bootstrap.enabled=${MOVIE_BOOTSTRAP_ENABLED:true}
movie.bootstrap.csv-path=${MOVIE_BOOTSTRAP_CSV:movies.csv}

movie.client.enabled=${MOVIE_CLIENT_ENABLED:false}
movie.client.base-url=${MOVIE_CLIENT_BASE_URL:http://localhost:8080}
movie.client.username=${MOVIE_CLIENT_USERNAME:${API_USERNAME:apiuser}}
movie.client.password=${MOVIE_CLIENT_PASSWORD:${API_PASSWORD:password}}
